# Site Configuration
title: Local-MIP
description: A Local Search Solver for Mixed Integer Programming
url: "https://local-mip.github.io"
baseurl: ""
lang: en_US
logo: /assets/images/localmip.png

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/localmip.png

# Build Settings
markdown: kramdown

# Exclude Files
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - ruby/
  - submodules/
  - update-solver.sh
  - AIJ-Local-MIP.pdf
  - CODE_BLOCK_OPTIMIZATION.md

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Markdown Settings
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Collections (if needed in future)
# collections:
#   agents:
#     output: true
